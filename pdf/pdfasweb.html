<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Notes – Single Page Viewer (No iframe)</title>
  <style>
/* Add near the top */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; max-width: 100%; overflow-x: hidden; }

/* Replace your .wrap rule with this */
.wrap { width: min(100%, 960px); margin: 0 auto; padding: 12px; }

/* Keep your canvas responsive */
canvas { width: 100%; max-width: 100%; height: auto; display: block;
         border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); background: #0e1117; }

    :root { --bg:#0b0c10; --ink:#e9eef2; --muted:#96a0aa; --accent:#4f8cff; }
    html,body{height:100%;}
    body{margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;}
    .wrap{max-width:960px; margin:0 auto; padding:16px;}
    header{position:sticky; top:0; z-index:10; backdrop-filter:saturate(1.2) blur(8px); background:color-mix(in oklab, var(--bg) 85%, transparent); border-bottom:1px solid #1b1f27;}
    .toolbar{display:flex; gap:8px; align-items:center; padding:10px 0; flex-wrap:wrap;}
    .toolbar h1{
  font-size:16px;
  font-weight:600;
  margin:0 12px 0 0;
  padding-left:3px;   /* 👈 add this */
  color:var(--ink);
}
    .spacer{flex:1}
    button, .btn{appearance:none; border:1px solid #2a2f3a; background:#12141a; color:var(--ink); padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600}
    button:hover, .btn:hover{border-color:#3a4252}
    input[type="range"]{accent-color:var(--accent)}
    #status{color:var(--muted); font-size:12px;}
    #viewer{display:flex; flex-direction:column; gap:16px; padding:16px 0 80px;}
    canvas{width:100%; height:auto; display:block; border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,.35); background:#0e1117}
    .page-shell{position:relative}
    .pageno{position:absolute; right:12px; bottom:12px; background:#0008; color:#fff; font-size:12px; padding:6px 10px; border-radius:999px;}
    footer{position:fixed; right:16px; bottom:16px; display:flex; gap:10px}


@media (max-width:600px){
  header { padding-inline:12px; }    /* pads both sides of the sticky header */
}

  </style>
  <!-- PDF.js (no iframe). Choose a fixed version to avoid breaking changes. -->
  <!-- Prefer self-hosted PDF.js to avoid CSP/adblock/CDN issues -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
  <header>
    <div class="wrap toolbar">
      <h1>PDF Notes</h1>
      <span id="status">Ready</span>
      <div class="spacer"></div>
      <label>Zoom <input id="zoom" type="range" min="50" max="250" value="115" /></label>
      <button id="fit">Fit Width</button>
      <a id="download" class="btn" href="#" download>Download</a>
    </div>
  </header>

  <main class="wrap">
    <div id="viewer" aria-live="polite"></div>
  </main>

  <footer>
    <button id="backToTop" title="Back to top">▲ Top</button>
  </footer>

  <script>
    // ==== CONFIG ====
    // Pass ?pdf=/path/to/file.pdf to the page URL, or hardcode here:
    const defaultPdfUrl = "SQLzerotohero.pdf"; // <-- put your PDF on the same domain to avoid CORS issues

    // PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    // Read the pdf URL from query string
    const params = new URLSearchParams(location.search);
    const pdfUrl = params.get("pdf") || defaultPdfUrl;
    
    // Update page title and header dynamically
const fileName = decodeURIComponent(pdfUrl.split('/').pop());
document.title = fileName.replace(/\.pdf$/i, '');
const headerTitle = document.querySelector('header h1');
if (headerTitle) headerTitle.textContent = fileName.replace(/\.pdf$/i, '');


    // Wire UX
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    const zoom = document.getElementById("zoom");
    const fit = document.getElementById("fit");
    const backToTop = document.getElementById("backToTop");
    const download = document.getElementById("download");
    download.href = pdfUrl;

    let doc = null;
    let baseScale = 1.15; // default scale
    let widthPx = 0; // real page width in CSS px for fit-width
    const pageCanvases = new Map();

    function setStatus(t){ const el = document.getElementById('status'); if (el) el.textContent = t; }

    function fullWidthScale(pageViewport) {
      // Compute a scale so canvas fits container width
      const shellWidth = viewer.clientWidth;
      return shellWidth / pageViewport.width;
    }

    function renderPage(pageNumber) {
      return doc.getPage(pageNumber).then(page => {
        const unscaled = page.getViewport({ scale: 1 });
        // Save original width once (for fit-width)
        if (!widthPx) widthPx = unscaled.width;

        const scale = baseScale * (zoom.value / 100);
        const viewport = page.getViewport({ scale });

        let shell = document.querySelector(`[data-page="${pageNumber}"]`);
        if (!shell) {
          shell = document.createElement("div");
          shell.className = "page-shell";
          shell.dataset.page = pageNumber;
          const cnv = document.createElement("canvas");
          const tag = document.createElement("div");
          tag.className = "pageno";
          tag.textContent = `Page ${pageNumber}`;
          shell.appendChild(cnv);
          shell.appendChild(tag);
          viewer.appendChild(shell);
          pageCanvases.set(pageNumber, cnv);
        }

        const canvas = pageCanvases.get(pageNumber);
        const context = canvas.getContext('2d', { alpha: false });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = { canvasContext: context, viewport, transform };
        return page.render(renderContext).promise;
      });
    }

    function renderAllPages() {
      if (!doc) return;
      setStatus(`Rendering ${doc.numPages} page(s)...`);
      // Render sequentially to keep memory smooth
      let chain = Promise.resolve();
      for (let i = 1; i <= doc.numPages; i++) {
        chain = chain.then(() => renderPage(i));
      }
      chain.then(() => setStatus(`Loaded ${doc.numPages} page(s)`))
           .catch(err => setStatus(`Error: ${err.message || err}`));
    }

    function refitWidth() {
      if (!doc || !widthPx) return;
      const shellWidth = viewer.clientWidth;
      // new baseScale so that unscaled width fits container; keep slider percent on top
      baseScale = shellWidth / widthPx;
      // Re-render quickly (only rescale canvases to avoid re-decoding)
      // For best quality we re-render pages; simple and robust.
      renderAllPages();
    }

    // Controls
    function rerenderExisting(){
      for (const pageNumber of pageCanvases.keys()) {
        renderPage(pageNumber);
      }
    }
    zoom.addEventListener('input', () => rerenderExisting());
    fit.addEventListener('click', refitWidth);
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('resize', () => {
      // Throttle resize work
      clearTimeout(window.__pdf_resize);
      window.__pdf_resize = setTimeout(refitWidth, 150);
    });

    // Boot
    setStatus('Fetching PDF...');
    const loadingTask = pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false });

    // Progress (helps diagnose slow loads)
    loadingTask.onProgress = ({ loaded, total }) => {
      if (total) {
        const pct = Math.max(0, Math.min(100, Math.round((loaded / total) * 100)));
        setStatus(`Loading ${pct}%`);
      } else {
        setStatus(`Loading ${loaded} bytes...`);
      }
    };

    loadingTask.promise
      .then(pdfDoc => {
        doc = pdfDoc;
        setStatus('Parsing...');
        // Fit width based on the first page's natural size
        return doc.getPage(1).then(first => {
          const unscaled = first.getViewport({ scale: 1 });
          if (!widthPx) widthPx = unscaled.width;
          refitWidth(); // sets baseScale and triggers initial width calc
          setStatus('Rendering page 1…');
          return renderPage(1).then(() => {
            setStatus('Rendering remaining pages…');
            // Lazy render the rest so UI becomes interactive quickly
            let i = 2;
            const step = () => {
              if (i > doc.numPages) {
                setStatus(`Loaded ${doc.numPages} page(s)`);
                return;
              }
              renderPage(i++).then(() => {
                setStatus(`Rendered ${i-1}/${doc.numPages}`);
                if ('requestIdleCallback' in window) {
                  requestIdleCallback(step, { timeout: 200 });
                } else {
                  setTimeout(step, 30);
                }
              });
            };
            step();
          });
        });
      })
      .catch(err => setStatus(`Error loading PDF: ${err.message || err}`));
  </script>
</body>
</html>
